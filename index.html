<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveLogアプリ</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff3366;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--accent-color); margin-bottom: 30px; }
        .container { width: 100%; max-width: 500px; }
        form {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }
        input:focus, textarea:focus { border-color: var(--accent-color); outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { opacity: 0.9; }
        .live-card {
            background-color: var(--card-bg);
            border-left: 5px solid var(--accent-color);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .live-artist { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .live-tour { font-size: 1rem; color: var(--text-muted); margin-bottom: 10px; }
        .live-memo { font-size: 0.9rem; white-space: pre-wrap; background: #252525; padding: 10px; border-radius: 4px; }
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: 1px solid #555;
            color: #ff4444;
            padding: 5px 10px;
            width: auto;
            font-size: 0.8rem;
        }
        .delete-btn:hover { background: #ff4444; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵ラおわのロ</h1>
        
        <!-- 入力フォーム -->
        <form id="liveForm">
            <div class="form-group">
                <label>日付</label>
                <input type="text" id="date" required placeholder="例: 2023-10-01">
            </div>
            <div class="form-group">
                <label>アーティスト/フェス</label>
                <input type="text" id="artist" required placeholder="例: ELLEGARDEN">
            </div>
            <div class="form-group">
                <label>会場</label>
                <input type="text" id="place" required placeholder="例: 幕張メッセ">
            </div>
            <div class="form-group">
                <label>メモ</label>
                <textarea id="memo" rows="3" placeholder="最高！アンコール1曲目に○○した！"></textarea>
            </div>
            <button type="submit">登録</button>
        </form>

        <!-- 一覧表示エリア -->
        <div id="liveList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
